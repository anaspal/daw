<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A7C5B">
<meta name="description" content="دوائي — منصة للبحث عن الأدوية المتوفرة في صيدليات قطاع غزة">
<title>دوائي — أقرب إلى الدواء</title>
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
<link rel="icon" type="image/png" href="./logo.png">
<script>
/* الوضع الليلي: تطبيق الثيم قبل الرسم لتجنب الوميض */
(function () {
  var KEY = 'dawai-theme';
  function meta(t) { var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', t === 'dark' ? '#0B1210' : '#0A7C5B'); }
  var saved = null; try { saved = localStorage.getItem(KEY); } catch (e) {}
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  var t = saved || (mq && mq.matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', t); meta(t);
  if (mq && mq.addEventListener) mq.addEventListener('change', function (e) {
    var s2 = null; try { s2 = localStorage.getItem(KEY); } catch (x) {}
    if (!s2) { var n = e.matches ? 'dark' : 'light'; document.documentElement.setAttribute('data-theme', n); meta(n); window.dispatchEvent(new Event('themechange')); }
  });
})();
</script>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">

<script>
/* PWA: التقاط حدث التثبيت مبكرًا (قد يصدر قبل تحميل التطبيق) + تسجيل الـ Service Worker */
window.__pwa = { deferred: null };
window.addEventListener('beforeinstallprompt', function (e) {
  e.preventDefault();
  window.__pwa.deferred = e;
  window.dispatchEvent(new Event('pwa-available'));
});
window.addEventListener('appinstalled', function () { window.__pwa.deferred = null; });
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function () {
    var hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('./sw.js').catch(function (err) { console.warn('[Dawai] SW', err); });
    var reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (hadController && !reloaded) { reloaded = true; location.reload(); }
    });
  });
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>
/* ==================== BASE ==================== */
*,::before,::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --d50:#ECFDF5;--d100:#D1FAE5;--d200:#A7F3D0;--d600:#0A7C5B;--d700:#086348;--d800:#064E3B;
  --g50:#F9FAFB;--g100:#F3F4F6;--g200:#E5E7EB;--g300:#D1D5DB;--g400:#9CA3AF;--g500:#6B7280;--g600:#4B5563;--g700:#374151;--g900:#111827;
  --a50:#FFFBEB;--a200:#FDE68A;--a500:#F59E0B;--a700:#B45309;
  --r50:#FEF2F2;--r200:#FECACA;--r700:#B91C1C;--r800:#991B1B;
  --e50:#ECFDF5;--e200:#A7F3D0;--e800:#065F46;
  --b50:#EFF6FF;--b200:#BFDBFE;--b900:#1E3A8A;
}
html{-webkit-tap-highlight-color:transparent}
body{font-family:'Tajawal',system-ui,-apple-system,sans-serif;background:#fff;color:var(--g700);overflow-x:hidden;-webkit-font-smoothing:antialiased;min-height:100dvh;line-height:1.5}
h1,h2,h3{color:var(--g900);font-weight:700;line-height:1.25}
button{cursor:pointer;font-family:inherit;border:none;background:none;font-size:inherit;color:inherit}
input,select,textarea,button{font-family:inherit;font-size:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--d600);outline-offset:2px}
img,svg{display:block;max-width:100%}

/* ==================== LAYOUT ==================== */
.container{max-width:1100px;margin:0 auto;padding:0 16px}
@media(min-width:640px){.container{padding:0 24px}}
@media(min-width:1024px){.container{padding:0 32px}}

.flex{display:flex}.flex-col{flex-direction:column}.flex-1{flex:1;min-width:0}.flex-wrap{flex-wrap:wrap}
.items-center{align-items:center}.items-start{align-items:flex-start}.items-end{align-items:flex-end}
.justify-center{justify-content:center}.justify-between{justify-content:space-between}
.gap-1{gap:4px}.gap-1\.5{gap:6px}.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}.gap-6{gap:24px}
.grid{display:grid}.grid-cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(min-width:640px){.sm-grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.sm-grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.sm-grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(min-width:1024px){.lg-grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.lg-grid-side{grid-template-columns:220px 1fr}.lg-grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}.lg-grid-1{grid-template-columns:1fr}}
.hidden{display:none}.inline-flex{display:inline-flex}.h-10{height:40px}.text-gray-800{color:#1F2937}
@media(min-width:768px){.md-flex{display:flex}.md-hidden{display:none}}
@media(max-width:767px){.md-only-hide{display:flex!important}}
@media(min-width:1024px){.lg-block{display:block}.lg-hidden{display:none}.lg-sticky{position:sticky;top:70px;height:fit-content}}

.min-w-0{min-width:0}.shrink-0{flex-shrink:0}.w-full{width:100%}
.w-7{width:28px;height:28px}.w-9{width:36px;height:36px}.w-10{width:40px;height:40px}.w-12{width:48px;height:48px}
.h-14{height:56px}
.max-w-md{max-width:448px}.max-w-2xl{max-width:672px}.max-w-3xl{max-width:768px}.max-w-sm{max-width:384px}
.mx-auto{margin-left:auto;margin-right:auto}.min-h-40{min-height:40px}.min-h-44{min-height:44px}.min-h-48{min-height:48px}.min-h-52{min-height:52px}
.min-h-screen{min-height:100dvh}.min-h-60vh{min-height:60vh}

/* ==================== SPACING ==================== */
.p-1{padding:4px}.p-1\.5{padding:6px}.p-2{padding:8px}.p-3{padding:12px}.p-4{padding:16px}.p-5{padding:20px}.p-6{padding:24px}.p-7{padding:28px}
.px-1{padding-inline:4px}.px-3{padding-inline:12px}.px-3\.5{padding-inline:14px}.px-4{padding-inline:16px}.px-6{padding-inline:24px}
.py-1{padding-block:4px}.py-2{padding-block:8px}.py-4{padding-block:16px}.py-6{padding-block:24px}.py-8{padding-block:32px}.py-10{padding-block:40px}.py-12{padding-block:48px}.py-16{padding-block:64px}
.pt-2{padding-top:8px}.pt-4{padding-top:16px}.pt-6{padding-top:24px}.pt-8{padding-top:32px}
.pb-1{padding-bottom:4px}.pb-4{padding-bottom:16px}.pb-10{padding-bottom:40px}.pb-16{padding-bottom:64px}
.ps-3{padding-inline-start:12px}.pe-10{padding-inline-end:40px}
.mt-0\.5{margin-top:2px}.mt-1{margin-top:4px}.mt-1\.5{margin-top:6px}.mt-2{margin-top:8px}.mt-3{margin-top:12px}.mt-4{margin-top:16px}.mt-5{margin-top:20px}.mt-6{margin-top:24px}.mt-8{margin-top:32px}.mt-12{margin-top:48px}.mt-16{margin-top:64px}
.mb-1{margin-bottom:4px}.mb-2{margin-bottom:8px}.mb-4{margin-bottom:16px}.mb-6{margin-bottom:24px}
.me-1{margin-inline-end:4px}
.-mx-4{margin-inline:-16px}

/* ==================== TYPOGRAPHY ==================== */
.text-xs{font-size:12px;line-height:1.5}.text-sm{font-size:14px;line-height:1.55}
.text-base{font-size:16px}.text-lg{font-size:18px}.text-xl{font-size:20px}.text-2xl{font-size:24px}.text-3xl{font-size:30px}
.text-10{font-size:10px}.text-11{font-size:11px}.text-15{font-size:15px}.text-26{font-size:26px}
.font-medium{font-weight:500}.font-semibold{font-weight:600}.font-bold{font-weight:700}.font-extrabold{font-weight:800}
.text-center{text-align:center}.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabular-nums{font-variant-numeric:tabular-nums}.leading-tight{line-height:1.2}.leading-relaxed{line-height:1.7}.leading-none{line-height:1}

/* ==================== COLORS ==================== */
.text-gray-400{color:var(--g400)}.text-gray-500{color:var(--g500)}.text-gray-600{color:var(--g600)}.text-gray-700{color:var(--g700)}.text-gray-900{color:var(--g900)}
.text-white{color:#fff}.text-dawai-600{color:var(--d600)}.text-dawai-700{color:var(--d700)}.text-dawai-800{color:var(--d800)}
.text-amber-600{color:#D97706}.text-amber-700{color:var(--a700)}.text-amber-900{color:#78350F}
.text-red-600{color:#DC2626}.text-red-700{color:var(--r700)}.text-red-800{color:var(--r800)}
.text-emerald-800{color:var(--e800)}.text-blue-900{color:var(--b900)}
.bg-white{background:#fff}.bg-gray-50{background:var(--g50)}.bg-gray-100{background:var(--g100)}.bg-gray-600{background:var(--g600)}.bg-gray-900{background:var(--g900)}
.bg-dawai-50{background:var(--d50)}.bg-dawai-600{background:var(--d600)}.bg-dawai-700{background:var(--d700)}
.bg-amber-50{background:var(--a50)}.bg-amber-500{background:var(--a500)}
.bg-red-50{background:var(--r50)}.bg-emerald-50{background:var(--e50)}.bg-blue-50{background:var(--b50)}
.bg-transparent{background:transparent}

/* ==================== BORDERS ==================== */
.border{border:1px solid var(--g200)}
.border-t{border-top:1px solid var(--g200)}.border-b{border-bottom:1px solid var(--g200)}
.border-gray-100{border-color:var(--g100)}.border-gray-200{border-color:var(--g200)}
.border-dawai-100{border-color:var(--d100)}.border-dawai-200{border-color:var(--d200)}.border-dawai-600{border-color:var(--d600)}
.border-amber-200{border-color:var(--a200)}.border-amber-500{border-color:var(--a500)}
.border-red-200{border-color:var(--r200)}.border-emerald-200{border-color:var(--e200)}.border-blue-200{border-color:var(--b200)}
.border-gray-600{border-color:var(--g600)}
.border-dashed{border-style:dashed}
.rounded{border-radius:4px}.rounded-lg{border-radius:8px}.rounded-xl{border-radius:12px}.rounded-2xl{border-radius:16px}.rounded-full{border-radius:9999px}
@media(min-width:640px){.sm-rounded-2xl{border-radius:16px}}

/* ==================== SHADOWS / POSITION ==================== */
.shadow-sm{box-shadow:0 1px 2px rgba(16,24,40,.04)}
.shadow-card{box-shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06)}
.shadow-xl{box-shadow:0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.1)}
.hover-shadow:hover{box-shadow:0 6px 16px rgba(16,24,40,.08)}
.relative{position:relative}.absolute{position:absolute}.fixed{position:fixed}.sticky{position:sticky}
.top-0{top:0}.top-half{top:50%}.end-3{inset-inline-end:12px}.inset-0{inset:0}
.z-20{z-index:20}.z-30{z-index:30}.z-50{z-index:50}
.translate-y-half{transform:translateY(-50%)}
.backdrop{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

/* ==================== OVERFLOW ==================== */
.overflow-hidden{overflow:hidden}
.scroll-x{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;-ms-overflow-style:none}
.scroll-x::-webkit-scrollbar{display:none}

/* ==================== COMPONENTS ==================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;font-weight:600;transition:all .15s;border:none;cursor:pointer;user-select:none;text-align:center;white-space:nowrap}
.btn-sm{min-height:40px;padding:0 12px;font-size:13px}
.btn-md{min-height:44px;padding:0 16px;font-size:15px}
.btn-lg{min-height:52px;padding:0 24px;font-size:16px}
.btn-block{width:100%}
.btn-primary{background:var(--d600);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--d700)}
.btn-primary:disabled{background:var(--g300);cursor:not-allowed}
.btn-secondary{background:var(--d50);color:var(--d700);border:1px solid var(--d100)}
.btn-secondary:hover:not(:disabled){background:var(--d100)}
.btn-ghost{background:transparent;color:var(--g700)}
.btn-ghost:hover:not(:disabled){background:var(--g100)}
.btn-danger{background:var(--r800);color:#fff}

.card{background:#fff;border:1px solid var(--g100);border-radius:14px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);padding:16px}

.input{width:100%;min-height:48px;padding:0 16px;border-radius:12px;background:#fff;border:1px solid var(--g200);color:var(--g900);font-size:15px;transition:all .15s}
.input::placeholder{color:var(--g400)}
.input:focus{outline:none;border-color:var(--d600);box-shadow:0 0 0 4px rgba(16,185,129,.15)}
.input-label{display:block;margin-bottom:6px;font-size:13px;font-weight:500;color:var(--g700)}
.input-group{margin-bottom:0}

.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:9999px;font-size:12px;font-weight:600;border:1px solid}
.badge-available{background:var(--d50);color:var(--d700);border-color:var(--d200)}
.badge-low{background:var(--a50);color:var(--a700);border-color:var(--a200)}
.badge-out{background:var(--g100);color:var(--g600);border-color:var(--g200)}
.badge-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.badge-available .badge-dot{background:var(--d600)}
.badge-low .badge-dot{background:var(--a500)}
.badge-out .badge-dot{background:var(--g400)}

.icon-btn{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;color:var(--g600);background:transparent;border:none;cursor:pointer;transition:background .15s;flex-shrink:0}
.icon-btn:hover{background:var(--g100)}
.icon-btn-danger{color:#DC2626}.icon-btn-danger:hover{background:var(--r50)}
.icon-btn-primary{color:var(--d700)}.icon-btn-primary:hover{background:var(--d50)}

.link-muted{color:var(--g600);transition:color .15s}
.link-muted:hover{color:var(--d700)}
.link-primary{color:var(--d700);font-weight:600}
.link-primary:hover{text-decoration:underline}

.nav-link{padding:8px 12px;border-radius:8px;font-size:14px;font-weight:500;color:var(--g600);transition:all .15s;display:inline-flex;align-items:center;gap:8px}
.nav-link:hover{color:var(--g900);background:var(--g50)}
.nav-link.active{background:var(--d50);color:var(--d700)}

.search-bar{display:flex;align-items:center;gap:8px;background:#fff;border-radius:16px;border:1px solid var(--g200);transition:all .15s;box-shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);padding:6px}
.search-bar:focus-within{border-color:var(--d600);box-shadow:0 0 0 4px rgba(16,185,129,.15)}
.search-input{flex:1;min-height:44px;background:transparent;border:none;outline:none;font-size:15px;padding:0}
.search-icon{padding-inline-start:12px;color:var(--g400);flex-shrink:0}

.empty-state{text-align:center;padding:48px 16px;border:1px dashed var(--g200);border-radius:16px;background:rgba(249,250,251,.5)}
.empty-icon{width:48px;height:48px;margin:0 auto 12px;border-radius:16px;background:#fff;border:1px solid var(--g100);color:var(--g500);display:flex;align-items:center;justify-content:center}

@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite}
.spinner-wrap{padding:64px 0;display:flex;justify-content:center}

/* Transitions */
.hover-bg-gray:hover{background:var(--g50)}
.hover-bg-dawai:hover{background:var(--d50)}
.hover-border-dawai:hover{border-color:var(--d200)}
.hover-text-dawai:hover{color:var(--d700)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:0}
@media(min-width:640px){.modal-overlay{align-items:center;padding:16px}}
.modal-content{background:#fff;width:100%;max-width:448px;border-radius:16px 16px 0 0;box-shadow:0 20px 25px -5px rgba(0,0,0,.1)}
@media(min-width:640px){.modal-content{border-radius:16px}}

/* Alert */
.alert{border-radius:12px;padding:12px;font-size:14px;display:flex;gap:8px;align-items:flex-start;border:1px solid}
.alert-warn{background:var(--a50);border-color:var(--a200);color:#78350F}
.alert-error{background:var(--r50);border-color:var(--r200);color:var(--r800)}
.alert-info{background:var(--b50);border-color:var(--b200);color:var(--b900)}
.alert-success{background:var(--d50);border-color:var(--d200);color:var(--d800)}

/* ==================== MOBILE BOTTOM NAV ==================== */
.side-nav{display:none}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.97);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--g200);box-shadow:0 -4px 16px rgba(16,24,40,.06)}
.bn-item{flex:1;min-width:0;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:12px;font-size:11px;font-weight:600;color:var(--g500);transition:all .15s}
.bn-item.active{color:var(--d700);background:var(--d50)}
.bn-item{text-align:center;line-height:1.2}
.site-link-hd{display:none!important}
@media(min-width:1024px){.site-link-hd{display:flex!important}}
.has-bottom-nav{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
@media(min-width:1024px){.side-nav{display:block}.bottom-nav{display:none}.has-bottom-nav{padding-bottom:0}}
header.sticky{padding-top:env(safe-area-inset-top,0px)}

/* Hero Image */
.hero-img {
  width: 180px;
  height: 180px;
  object-fit: contain;
  margin: 0 auto 16px;
  filter: drop-shadow(0 10px 15px rgba(10, 124, 91, 0.15));
}
@media(min-width: 640px) {
  .hero-img { width: 220px; height: 220px; }
}

/* ==================== UI POLISH (v1.2) ==================== */
/* الشعار دائري */
.logo-circle{border-radius:50%;object-fit:contain;background:#fff;border:1px solid var(--d100);padding:6%;box-shadow:0 2px 8px rgba(10,124,91,.12)}
.hero-img.logo-circle{padding:9%;border:4px solid #fff;filter:none;box-shadow:0 14px 34px rgba(10,124,91,.2),0 0 0 1px var(--d100)}
/* الشعار: يُكبَّر داخل الدائرة (غيّر --logo-zoom لضبط الحجم: 1 = بدون تكبير، لا تتجاوز 1.2) */
:root{--logo-zoom:1.1}
.logo-wrap{display:block;flex-shrink:0;border-radius:50%;overflow:hidden;background:#fff;border:1px solid var(--d100);box-shadow:0 2px 8px rgba(10,124,91,.12)}
.logo-wrap img{width:100%;height:100%;object-fit:contain;transform:scale(var(--logo-zoom))}
.hero-img.logo-wrap{border:4px solid #fff;filter:none;box-shadow:0 14px 34px rgba(10,124,91,.2),0 0 0 1px var(--d100)}

/* خلفية الهيرو */
.hero-bg{background:radial-gradient(60% 50% at 85% 0%,rgba(167,243,208,.55),transparent 70%),radial-gradient(50% 45% at 10% 20%,rgba(209,250,229,.7),transparent 70%),linear-gradient(to bottom,#F3FDF8,#fff)}

/* أزرار وبطاقات */
.btn{transition:transform .12s,box-shadow .15s,background .15s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--d600),#0B8F68);box-shadow:0 4px 12px rgba(10,124,91,.25)}
.btn-primary:hover:not(:disabled){background:linear-gradient(135deg,var(--d700),var(--d600));box-shadow:0 6px 16px rgba(10,124,91,.3)}
.btn-primary:disabled{background:var(--g300);box-shadow:none}
.card{border-radius:16px;transition:transform .18s,box-shadow .18s,border-color .18s}
a.card:hover,.hover-shadow:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(16,24,40,.09);border-color:var(--d100)}
.search-bar{border-radius:18px;box-shadow:0 6px 20px rgba(16,24,40,.07)}
.input:focus{border-color:var(--d600);box-shadow:0 0 0 4px rgba(10,124,91,.14)}
.badge{letter-spacing:.1px}

/* الشريط العلوي */
header.sticky{transition:box-shadow .2s}
body.scrolled header.sticky{box-shadow:0 4px 18px rgba(16,24,40,.07)}
.nav-link{transition:all .15s}

/* انتقال الصفحات */

const AuthCtx = createContext({ user: null, role: null, loading: true });

function AuthProvider({ children }) {
  const [state, setState] = useState({ user: null, role: null, loading: true });

  useEffect(() => {
    let unsubDoc;
    const unsubAuth = onAuthStateChanged(auth, (user) => {
      if (unsubDoc) { unsubDoc(); unsubDoc = undefined; }
      if (!user) { setState({ user: null, role: null, loading: false }); return; }

      setState({ user, role: null, loading: true });
      unsubDoc = onSnapshot(doc(db, 'users', user.uid),
        (snap) => {
          const data = snap.data();
          const role = snap.exists() && data?.isActive !== false ? data?.role : null;
          setState({ user, role, loading: false });
        },
        () => setState({ user, role: null, loading: false })
      );
    });
    return () => { if (unsubDoc) unsubDoc(); unsubAuth(); };
  }, []);

  return h(AuthCtx.Provider, { value: state }, children);
}
const useAuth = () => useContext(AuthCtx);

function useRoute() {
  const [hash, setHash] = useState(window.location.hash.slice(1) || '/');
  useEffect(() => {
    const handler = () => setHash(window.location.hash.slice(1) || '/');
    window.addEventListener('hashchange', handler);
    return () => window.removeEventListener('hashchange', handler);
  }, []);
  const [path, qstr] = hash.split('?');
  return { path, params: new URLSearchParams(qstr || '') };
}

  window.location.hash = to;

function Link({ href, children, class: cls, activeClass, exact, onClick, ...rest }) {
  const { path } = useRoute();
  const isActive = activeClass && (path === href || (!exact && href !== '/' && path.startsWith(href + '/')));
  const handleClick = (e) => {
    if (onClick) onClick(e);
    e.preventDefault();
    window.location.hash = href;
  };
  return html`<a href=${'#' + href} onClick=${handleClick} class=${[cls, isActive ? activeClass : ''].filter(Boolean).join(' ')} ...${rest}>${children}</a>`;
}

function goBack(fallback = '/') {
  if (window.history.length > 1) window.history.back();
  else navigate(fallback);
}

function BackButton({ fallback = '/', label = 'رجوع' }) {
  return html`<button type="button" onClick=${() => goBack(fallback)} class="flex items-center gap-1 text-sm text-gray-600" style="padding:6px 4px;min-height:40px;align-self:flex-start;background:none;border:0;cursor:pointer"><${IcoChevronRight} size=${16} /> ${label}</button>`;
}

function matchPath(pattern, path) {
  const pp = pattern.split('/').filter(Boolean);
  const ap = path.split('/').filter(Boolean);
  if (pp.length !== ap.length) return null;
  const params = {};
  for (let i = 0; i < pp.length; i++) {
    if (pp[i].startsWith(':')) params[pp[i].slice(1)] = decodeURIComponent(ap[i]);
    else if (pp[i] !== ap[i]) return null;
  }
  return params;
}

// تصغير الصورة في المتصفح وتحويلها إلى نص (data URL) لتخزينها مع مستند الدواء بدون Storage
function fileToResizedDataUrl(file, maxSide = 360, quality = 0.6) {
  return new Promise((resolve, reject) => {
    if (!file || !String(file.type).startsWith('image/')) return reject(new Error('NOT_IMAGE'));
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('READ_FAILED'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('BAD_IMAGE'));
      img.onload = () => {
        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        const cw = Math.max(1, Math.round(img.width * scale));
        const ch = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = cw; canvas.height = ch;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cw, ch);
        ctx.drawImage(img, 0, 0, cw, ch);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function searchInventory({ text, areaId, availability, pageSize = 20 }) {
  const constraints = [where('pharmacyActive', '==', true)];
  if (areaId) constraints.push(where('areaId', '==', areaId));
  if (availability) constraints.push(where('availability', '==', availability));
  const found = new Map();
  let truncated = false;
  const add = ({ docs, size }) => {
    docs.forEach(d => { if (!found.has(d.id)) found.set(d.id, { id: d.id, ...d.data() }); });
    if (size >= pageSize) truncated = true;
  };
  const col = collection(db, 'inventory');

  if (text && text.trim()) {
    const na = normalizeArabic(text);          // حروف صغيرة + توحيد عربي
    const ne = normalizeLatin(text);
    const words = na.split(' ').filter(Boolean);
    const key = [...words].sort((a, b) => b.length - a.length)[0].slice(0, 20);
    const prefixQ = (field, v) => getDocs(query(col, where(field, '>=', v), where(field, '<=', v + PREFIX_END), ...constraints, limit(pageSize)));
    const settled = await Promise.allSettled([
      prefixQ('searchNameAr', na),
      prefixQ('searchNameEn', ne),
      getDocs(query(col, where('searchTokens', 'array-contains', key), ...constraints, limit(pageSize)))
        .then(snap => ({ size: snap.size, docs: snap.docs.filter(d => { const t = d.data().searchTokens || []; return words.every(w => t.includes(w.slice(0, 20))); }) }))
        .catch(e => { console.warn('[Dawai] فهرس searchTokens ناقص (انشر firestore.indexes.json):', e?.message); return { size: 0, docs: [] }; })
    ]);
    let firstErr = null;
    settled.forEach((r, i) => {
      if (r.status === 'fulfilled') add(r.value);
      else {
        firstErr = firstErr || r.reason;
        // رسالة الخطأ تحتوي رابطًا لإنشاء الفهرس المطلوب بضغطة واحدة
        console.warn('[Dawai] استعلام بحث فشل (' + ['اسم عربي', 'اسم إنجليزي', 'كلمات'][i] + '):', r.reason?.message || r.reason);
      }
    });
    // لو فشل شيء ولم نجد أي نتيجة، نُظهر الخطأ بدل "لا توجد نتائج" المضلِّلة
    if (firstErr && found.size === 0) throw firstErr;
    return { items: [...found.values()], truncated };
  }
  const snap = await getDocs(query(col, ...constraints, limit(pageSize)));
  add(snap);
  return { items: [...found.values()].sort(byUpdatedDesc), truncated };
}

async function rebuildSearchIndex(onProgress) {
  const snap = await getDocs(collection(db, 'inventory'));
  let n = 0;
  for (let i = 0; i < snap.docs.length; i += 400) {
    const batch = writeBatch(db);
    snap.docs.slice(i, i + 400).forEach(d => {
      const x = d.data();
      batch.update(d.ref, {
        searchNameAr: normalizeArabic(`${x.medicineNameAr} ${x.scientificName || ''} ${x.activeIngredient || ''}`),
        searchNameEn: normalizeLatin(`${x.medicineNameEn} ${x.scientificName || ''} ${x.activeIngredient || ''}`),
        searchTokens: buildSearchTokens(x.medicineNameAr, x.medicineNameEn, x.scientificName, x.activeIngredient)
      });
      n++;
    });
    await batch.commit();
    if (onProgress) onProgress(n);
  }
  return n;
}

async function cascadePharmacyActive(pharmacyId, active) {
  const snap = await getDocs(query(collection(db, 'inventory'), where('pharmacyId', '==', pharmacyId)));

    const batch = writeBatch(db);
    snap.docs.slice(i, i + 400).forEach(d => batch.update(d.ref, { pharmacyActive: active }));
    await batch.commit();
  }
}

    whatsapp: input.whatsapp || '', address: input.address || '',
    isActive: true, createdAt: serverTimestamp()
  });
  await batch.commit();
}

async function setPharmacyActive(id, active) {

async function listUsers() {
  const snap = await getDocs(query(collection(db, 'users'), limit(200)));
  return snap.docs.map(d => ({ uid: d.id, ...d.data() }));
}
async function setUserActive(uid, active) { await updateDoc(doc(db, 'users', uid), { isActive: active }); }

async function syncPharmacyToInventory(pharmacy) {
  const snap = await getDocs(query(collection(db, 'inventory'), where('pharmacyId', '==', pharmacy.id)));
  let count = 0;
  for (let i = 0; i < snap.docs.length; i += 400) {
    const batch = writeBatch(db);
    snap.docs.slice(i, i + 400).forEach(d => {
      batch.update(d.ref, {
        pharmacyName: pharmacy.name, areaId: pharmacy.areaId,
        pharmacyPhone: pharmacy.phone, pharmacyWhatsapp: pharmacy.whatsapp || ''
      });
      count++;
    });
    await batch.commit();
  }
  return count;
}

/* ============================================================
   🌙  Theme (dark mode)
   ============================================================ */
function useTheme() {
  const read = () => document.documentElement.getAttribute('data-theme') || 'light';
  const [theme, setTheme] = useState(read());
  useEffect(() => {
    const sync = () => setTheme(read());
    window.addEventListener('themechange', sync);
    return () => window.removeEventListener('themechange', sync);
  }, []);
  const toggle = () => {
    const next = read() === 'dark' ? 'light' : 'dark';
    const root = document.documentElement;
    root.classList.add('theme-anim');
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('dawai-theme', next); } catch (e) {}
    const m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', next === 'dark' ? '#0B1210' : '#0A7C5B');
    setTheme(next);
    window.dispatchEvent(new Event('themechange'));
    setTimeout(() => root.classList.remove('theme-anim'), 450);
  };
  return { theme, toggle };
}

function ThemeToggle() {
  const { theme, toggle } = useTheme();
  const dark = theme === 'dark';
  return html`<button type="button" class="theme-toggle" onClick=${toggle} aria-label=${dark ? 'الوضع النهاري' : 'الوضع الليلي'} title=${dark ? 'الوضع النهاري' : 'الوضع الليلي'}>
    <span class="ti" key=${theme}>${dark ? html`<${IcoSun} size=${20} />` : html`<${IcoMoon} size=${20} />`}</span>
  </button>`;
}

/* ============================================================
   📲  PWA install
   ============================================================ */
function useInstall() {
  const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  const [can, setCan] = useState(!!(window.__pwa && window.__pwa.deferred));
  const [installed, setInstalled] = useState(isStandalone());
  useEffect(() => {
    const onAvail = () => setCan(!!window.__pwa.deferred);
    const onInstalled = () => { setInstalled(true); setCan(false); };
    window.addEventListener('pwa-available', onAvail);
    window.addEventListener('appinstalled', onInstalled);
    return () => { window.removeEventListener('pwa-available', onAvail); window.removeEventListener('appinstalled', onInstalled); };
  }, []);
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
  const install = async () => {
    const d = window.__pwa && window.__pwa.deferred;
    if (d) {
      d.prompt();
      try { await d.userChoice; } catch (e) {}
      window.__pwa.deferred = null; setCan(false);
    } else if (ios) {
      alert('لتثبيت التطبيق على آيفون: اضغط زر المشاركة في Safari ثم اختر «إضافة إلى الشاشة الرئيسية».');
    }
  };
  return { show: !installed && (can || ios), install };
}

function SearchPage({ route }) {
  const initialQ = route.params.get('q') || '';
  const areaId = route.params.get('area') || undefined;
  const availabilityParam = route.params.get('status') || undefined;

  const [q, setQ] = useState(initialQ);
  const [items, setItems] = useState(null);
  const [truncated, setTruncated] = useState(false);
  const [error, setError] = useState(null);
  const [loading, setLoading] = useState(true);
  const [pageSize, setPageSize] = useState(20);
  const { nameOf } = useRegions();

  const [debouncedQ, setDebouncedQ] = useState(initialQ.trim());

  // عند تغيّر الرابط (فلتر / رجوع) نزامن النص
  useEffect(() => { setPageSize(20); setQ(initialQ); setDebouncedQ(initialQ.trim()); }, [initialQ, areaId, availabilityParam]);

  // بحث فوري أثناء الكتابة (بعد توقف قصير 250ms) + تحديث الرابط بدون إضافة سجل
  useEffect(() => {
    const t = setTimeout(() => {
      const v = q.trim();
      setDebouncedQ(v);
      const next = new URLSearchParams(route.params);
      if (v) next.set('q', v); else next.delete('q');
      try { window.history.replaceState(null, '', '#/search' + (next.toString() ? '?' + next.toString() : '')); } catch (e) {}
    }, 250);
    return () => clearTimeout(t);
  }, [q]);

  useEffect(() => {
    let mounted = true;
    setLoading(true); setError(null);
    searchInventory({ text: debouncedQ || undefined, areaId, availability: availabilityParam, pageSize })
      .then(r => { if (mounted) { setItems(r.items); setTruncated(r.truncated); } })
      .catch(e => {
        console.error('Search error:', e);
        if (!mounted) return;
        setItems([]); setTruncated(false);
        setError(e?.code === 'failed-precondition'
          ? 'البحث يحتاج فهرسًا في قاعدة البيانات. راجع إعدادات المشرف.'
          : 'تعذر تنفيذ البحث. تحقق من الإنترنت وحاول مرة أخرى.');
      })
      .finally(() => mounted && setLoading(false));
    return () => { mounted = false; };
  }, [debouncedQ, areaId, availabilityParam, pageSize]);

  const submit = (e) => {
    e.preventDefault();
    setDebouncedQ(q.trim());
  };

  // يبني الرابط بالنص الحالي (حتى لا نفقد ما كُتب عند تغيير الفلاتر)
  const currentParams = () => {
    const next = new URLSearchParams(route.params);
    if (q.trim()) next.set('q', q.trim()); else next.delete('q');
    return next;
  };

  const setArea = (id) => {
    const next = currentParams();
    if (id) next.set('area', id); else next.delete('area');
    navigate('/search?' + next.toString());
  };

  const setAvailability = (v) => {
    const next = currentParams();
    if (v === 'any') next.delete('status'); else next.set('status', v);
    navigate('/search?' + next.toString());
  };

  return html`
    <div class="container" style="padding-top:16px;display:flex;flex-direction:column;gap:16px">
      <${BackButton} fallback="/" />
      <form onSubmit=${submit}>

function LoginPage() {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState(null);
  const [loading, setLoading] = useState(false);

  const onSubmit = async (e) => {
    e.preventDefault();
    if (!CONFIGURED) { setError('لم تُضبط إعدادات Firebase بعد. عدّل firebaseConfig في أعلى الملف.'); return; }
    setError(null); setLoading(true);
    try {
      const cred = await signInWithEmailAndPassword(auth, email.trim(), password);
      const userSnap = await getDoc(doc(db, 'users', cred.user.uid));
      if (!userSnap.exists() || userSnap.data().isActive === false) {
        await auth.signOut();
        setError('هذا الحساب غير مفعّل أو غير مصرح له بالدخول.');
        return;
      }
      const role = userSnap.data().role;
      if (role === 'admin') navigate('/admin');
      else if (role === 'pharmacy') navigate('/pharmacy');
      else { await auth.signOut(); setError('هذا الحساب لا يملك صلاحية الدخول إلى لوحة التحكم.'); }
    } catch (err) {
      const msgs = {
        'auth/invalid-credential': 'البريد الإلكتروني أو كلمة المرور غير صحيحة.',
        'auth/user-disabled': 'هذا الحساب موقوف.',
        'auth/too-many-requests': 'محاولات كثيرة. انتظر قليلًا.',
        'auth/network-request-failed': 'تعذر الاتصال. تحقق من الإنترنت.',
        'auth/invalid-api-key': 'إعدادات Firebase غير مكتملة.'
      };
      setError(msgs[err?.code] || 'حدث خطأ غير متوقع. حاول مرة أخرى.');
    } finally { setLoading(false); }
  };

  return html`
    <div style="min-height:100dvh;display:flex;flex-direction:column;background:var(--g50)">
      <div class="container flex items-center justify-between" style="padding:24px 16px">
        <${Link} href="/" class="flex items-center gap-2">
          <${Logo} size=${36} />
          <span class="font-extrabold text-gray-900">دوائي</span>
        <//>
        <${ThemeToggle} />
      </div>
      <div class="flex-1 flex items-start justify-center" style="padding:0 16px 40px">
        <div style="width:100%;max-width:448px;margin-top:40px">
          <${Card} class="p-6">
            <h1 style="font-size:20px;font-weight:800">دخول لوحة التحكم</h1>
            <p class="text-sm text-gray-600" style="margin-top:4px">هذه الصفحة مخصصة للصيدليات المعتمدة وإدارة المنصة فقط.</p>
            ${!CONFIGURED && html`<div class="alert alert-warn" style="margin-top:16px"><${IcoAlertCircle} size=${18} style="flex-shrink:0;margin-top:2px" /><span>إعدادات Firebase غير مكتملة. الدخول لن يعمل.</span></div>`}
            <form onSubmit=${onSubmit} style="margin-top:20px;display:flex;flex-direction:column;gap:16px">
              <${Input} label="البريد الإلكتروني" type="email" autocomplete="username" required value=${email} onInput=${e => setEmail(e.target.value)} />
              <${Input} label="كلمة المرور" type="password" autocomplete="current-password" required value=${password} onInput=${e => setPassword(e.target.value)} />
              ${error && html`<div class="alert alert-error" role="alert"><span>${error}</span></div>`}
              <${Button} type="submit" size="lg" block disabled=${loading || !CONFIGURED}>${loading ? 'جارٍ الدخول...' : 'دخول'}<//>
            </form>
            <p class="text-xs text-gray-500" style="margin-top:20px;line-height:1.65">لا تملك حسابًا؟ حسابات الصيدليات تُنشأ من قِبل إدارة المنصة فقط.</p>
          <//>
          <div style="text-align:center;margin-top:16px"><${Link} href="/" class="text-sm text-gray-600">← العودة للموقع<//></div>
        </div>
      </div>
    </div>
  `;
}

function PharmacyInventoryPage() {
  const [items, setItems] = useState(null);
  const [error, setError] = useState(null);
  const [q, setQ] = useState('');

  useEffect(() => {
    listMyInventory().then(setItems).catch(e => setError(e?.message || 'تعذر تحميل المخزون'));
  }, []);

  const filtered = useMemo(() => {
    if (!items) return [];
    if (!q.trim()) return items;
    const na = normalizeArabic(q), ne = normalizeLatin(q);
    return items.filter(i => (i.searchNameAr || '').includes(na) || (i.searchNameEn || '').includes(ne));
  }, [items, q]);

  const onDelete = async (item) => {
    if (!confirm(`حذف «${item.medicineNameAr}» نهائيًا؟`)) return;
    try {
      await deleteInventoryItem(item.id);
      setItems(prev => prev.filter(i => i.id !== item.id));
    } catch { alert('تعذر الحذف.'); }
  };

  const onToggle = async (item, next) => {
    const prev = item.availability;
    setItems(list => list.map(i => i.id === item.id ? { ...i, availability: next } : i));
    try { await updateAvailability(item.id, next); }
    catch { setItems(list => list.map(i => i.id === item.id ? { ...i, availability: prev } : i)); alert('تعذر التحديث.'); }
  };

  return html`
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="flex items-center justify-between gap-3">
        <div>
          <h1 style="font-size:20px;font-weight:800">المخزون</h1>
          <p class="text-sm text-gray-600" style="margin-top:2px">${items ? items.length + ' دواء' : '—'}</p>
        </div>
        <${Link} href="/pharmacy/inventory/new"><${Button} size="md"><${IcoPlus} size=${18} /> إضافة<//><//>
      </div>

      <div class="relative">
        <span class="absolute top-half translate-y-half end-3" style="color:var(--g400);pointer-events:none"><${IcoSearch} size=${18} /></span>
        <input class="input" style="padding-inline-end:40px" placeholder="ابحث داخل مخزون صيدليتك..." value=${q} onInput=${e => setQ(e.target.value)} />
      </div>

      ${error && html`<div class="alert alert-error"><span>${error}</span></div>`}
      ${items === null && !error && html`<div class="spinner-wrap"><${Spinner} /></div>`}

      ${items && filtered.length === 0 && html`
        <${EmptyState} icon=${h(IcoPackage, { size: 22 })} title=${items.length === 0 ? 'لا يوجد أدوية بعد' : 'لا توجد نتائج'} body=${items.length === 0 ? 'ابدأ بإضافة أول دواء في مخزون صيدليتك.' : 'جرّب كلمة بحث أخرى.'} />
      `}

      ${filtered.length > 0 && html`
        <div class="grid gap-3">
          ${filtered.map(item => html`
            <div class="card">
              <div class="flex items-start justify-between gap-3">
                ${item.image && html`<img src=${item.image} alt="" loading="lazy" style="width:56px;height:56px;object-fit:cover;border-radius:10px;flex-shrink:0;border:1px solid var(--g100)" />`}
                <div class="min-w-0" style="flex:1">
                  <div class="font-bold text-gray-900 truncate">${item.medicineNameAr}</div>
                  ${item.medicineNameEn && html`<div class="text-xs text-gray-500 truncate" dir="ltr" style="margin-top:2px">${item.medicineNameEn}${item.strength ? ' — ' + item.strength : ''}</div>`}
                  <div class="flex flex-wrap items-center gap-2" style="margin-top:8px">
                    <${AvailabilityBadge} status=${item.availability} />
                    <span class="text-xs text-gray-500">آخر تحديث: ${timeAgo(item.lastUpdatedAt)}</span>
                  </div>
                </div>
                <div class="flex items-center gap-1 shrink-0">
                  <${Link} href=${'/pharmacy/inventory/' + item.id} class="icon-btn" aria-label="تعديل"><${IcoPencil} size=${17} /><//>
                  <button class="icon-btn icon-btn-danger" onClick=${() => onDelete(item)} aria-label="حذف"><${IcoTrash} size=${17} /></button>
                </div>
              </div>
              <div class="grid grid-cols-3 gap-1.5" style="margin-top:12px">
                ${['available', 'low', 'out'].map(s => {
                  const active = item.availability === s;
                  const bg = active ? (s === 'available' ? 'var(--d600)' : s === 'low' ? 'var(--a500)' : 'var(--g600)') : '#fff';
                  const fg = active ? '#fff' : 'var(--g700)';
                  const label = s === 'available' ? 'متوفر' : s === 'low' ? 'محدود' : 'غير متوفر';
                  return html`<button onClick=${() => onToggle(item, s)} class="text-xs font-semibold" style="min-height:40px;border-radius:8px;border:1px solid ${active ? bg : 'var(--g200)'};background:${bg};color:${fg}">${label}</button>`;
                })}
              </div>
            </div>
          `)}
        </div>
      `}
    </div>
  `;
}

function InventoryForm({ initial, onSubmit, submitLabel, title }) {
  const EMPTY = { medicineNameAr: '', medicineNameEn: '', scientificName: '', activeIngredient: '', strength: '', dosageForm: '', availability: 'available', quantityApprox: '', image: '' };
  const [values, setValues] = useState(initial || EMPTY);
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState(null);

  const set = (k, v) => setValues(prev => ({ ...prev, [k]: v }));
  const [imgBusy, setImgBusy] = useState(false);

  const onPickImage = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    setError(null); setImgBusy(true);
    try {
      const url = await fileToResizedDataUrl(file);
      if (url.length > 150000) throw new Error('TOO_BIG');
      set('image', url);
    } catch { setError('تعذر استخدام هذه الصورة. جرّب صورة أخرى (JPG أو PNG).'); }
    finally { setImgBusy(false); }
  };

  const handle = async (e) => {
    e.preventDefault();
    if (imgBusy) return;
    if (!values.medicineNameAr.trim() || !values.medicineNameEn.trim()) {
      setError('الاسم العربي والإنجليزي مطلوبان.'); return;
    }
    setError(null); setSaving(true);
    try {
      await onSubmit(values);
      navigate('/pharmacy/inventory');
    } catch (err) {
      setError(err?.message === 'PHARMACY_NOT_FOUND'
        ? 'لم يتم العثور على بيانات صيدليتك. تواصل مع الإدارة.'
        : 'تعذر الحفظ. حاول مرة أخرى.');
    } finally { setSaving(false); }
  };

  return html`
    <div style="max-width:42rem">
      <h1 style="font-size:20px;font-weight:800;margin-bottom:16px">${title}</h1>
      <${Card}>
        <form onSubmit=${handle} style="display:flex;flex-direction:column;gap:16px">
          <${Input} label="الاسم العربي *" value=${values.medicineNameAr} onInput=${e => set('medicineNameAr', e.target.value)} placeholder="مثال: بانادول" required />
          <${Input} label="الاسم الإنجليزي *" value=${values.medicineNameEn} onInput=${e => set('medicineNameEn', e.target.value)} placeholder="Panadol" dir="ltr" required />
          <div class="grid gap-4 sm-grid-2">
            <${Input} label="الاسم العلمي" value=${values.scientificName} onInput=${e => set('scientificName', e.target.value)} placeholder="Paracetamol" dir="ltr" />
            <${Input} label="المادة الفعالة" value=${values.activeIngredient} onInput=${e => set('activeIngredient', e.target.value)} placeholder="Paracetamol" dir="ltr" />
            <${Input} label="التركيز" value=${values.strength} onInput=${e => set('strength', e.target.value)} placeholder="500mg" dir="ltr" />
            <${Input} label="الشكل الصيدلاني" value=${values.dosageForm} onInput=${e => set('dosageForm', e.target.value)} placeholder="أقراص / شراب / كبسولات" />
          </div>
          <div>
            <label class="input-label">حالة التوفر *</label>
            <div class="grid grid-cols-3 gap-2">
              ${['available', 'low', 'out'].map(s => {
                const active = values.availability === s;
                const bg = active ? (s === 'available' ? 'var(--d600)' : s === 'low' ? 'var(--a500)' : 'var(--g600)') : '#fff';
                return html`<button type="button" onClick=${() => set('availability', s)} class="text-sm font-semibold" style="min-height:44px;border-radius:12px;border:1px solid ${active ? bg : 'var(--g200)'};background:${bg};color:${active ? '#fff' : 'var(--g700)'}">${s === 'available' ? 'متوفر' : s === 'low' ? 'محدود' : 'غير متوفر'}</button>`;
              })}
            </div>
          </div>
          <${Input} label="الكمية التقريبية (اختياري)" value=${values.quantityApprox} onInput=${e => set('quantityApprox', e.target.value)} placeholder="مثال: أقل من 10 علب" />
          <div>
            <label class="input-label">صورة الدواء (اختياري)</label>
            ${values.image && html`
              <div class="flex items-center gap-3" style="margin-bottom:8px">
                <img src=${values.image} alt="صورة الدواء" style="width:96px;height:96px;object-fit:cover;border-radius:12px;border:1px solid var(--g200)" />
                <${Button} type="button" variant="ghost" size="md" onClick=${() => set('image', '')}>إزالة الصورة<//>
              </div>
            `}
            <label class="btn btn-secondary btn-md" style="cursor:pointer">
              <${IcoPlus} size=${16} /> ${imgBusy ? 'جارٍ تجهيز الصورة...' : (values.image ? 'تغيير الصورة' : 'اختيار صورة')}
              <input type="file" accept="image/*" onChange=${onPickImage} style="display:none" />
            </label>
          </div>
          ${error && html`<div class="alert alert-error"><span>${error}</span></div>`}
          <div class="flex gap-2" style="padding-top:8px">
            <${Link} href="/pharmacy/inventory" class="btn btn-ghost btn-lg">إلغاء<//>
            <div class="flex-1"><${Button} type="submit" size="lg" block disabled=${saving}>${saving ? 'جارٍ الحفظ...' : submitLabel}<//></div>
          </div>
        </form>
      <//>
    </div>
  `;
}

function PharmacyProfilePage() {
  const { nameOf } = useRegions();
  const [pharmacy, setPharmacy] = useState(null);
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState(null);
  const [success, setSuccess] = useState(false);
  const [values, setValues] = useState({ name: '', phone: '', whatsapp: '', address: '' });

  useEffect(() => {
    const uid = auth.currentUser?.uid;
    if (!uid) return;
    getDoc(doc(db, 'pharmacies', uid)).then(snap => {
      if (snap.exists()) {
        const p = { id: snap.id, ...snap.data() };
        setPharmacy(p);
        setValues({ name: p.name, phone: p.phone, whatsapp: p.whatsapp || '', address: p.address || '' });
      }
      setLoading(false);
    }).catch(() => { setError('تعذر تحميل البيانات.'); setLoading(false); });
  }, []);

  const set = (k, v) => { setValues(p => ({ ...p, [k]: v })); setSuccess(false); };

  const submit = async (e) => {
    e.preventDefault();
    if (!values.name.trim() || !values.phone.trim()) { setError('الاسم والهاتف مطلوبان.'); return; }
    setSaving(true); setError(null); setSuccess(false);
    try {
      await updateDoc(doc(db, 'pharmacies', auth.currentUser.uid), {
        name: values.name.trim(), phone: values.phone.trim(),
        whatsapp: values.whatsapp.trim(), address: values.address.trim()
      });
      try {
        await syncPharmacyToInventory({ ...pharmacy, name: values.name.trim(), phone: values.phone.trim(), whatsapp: values.whatsapp.trim() });
        setSuccess(true);
      } catch { setError('تم حفظ بياناتك، لكن تعذر تحديثها في نتائج البحث. أعد المحاولة أو تواصل مع الإدارة.'); }
    } catch { setError('تعذر الحفظ.'); }
    finally { setSaving(false); }
  };

  if (loading) return html`<div class="spinner-wrap"><${Spinner} /></div>`;
  if (!pharmacy) return html`<${Card} class="text-center">لا توجد بيانات صيدلية مرتبطة بحسابك.<//>`;

  return html`
    <div style="max-width:42rem;display:flex;flex-direction:column;gap:16px">
      <h1 style="font-size:20px;font-weight:800">بيانات الصيدلية</h1>
      <div class="alert alert-info">
        <${IcoInfo} size=${18} style="flex-shrink:0;margin-top:2px" />
        <div class="text-sm" style="line-height:1.7">تغيير الاسم أو الهاتف أو الواتساب يُحدَّث تلقائيًا في كل أدويتك الظاهرة في نتائج البحث.</div>
      </div>
      <${Card}>
        <form onSubmit=${submit} style="display:flex;flex-direction:column;gap:16px">
          <${Input} label="اسم الصيدلية *" value=${values.name} onInput=${e => set('name', e.target.value)} required />
          <div class="grid gap-4 sm-grid-2">
            <${Input} label="الهاتف *" value=${values.phone} onInput=${e => set('phone', e.target.value)} dir="ltr" required />
            <${Input} label="واتساب" value=${values.whatsapp} onInput=${e => set('whatsapp', e.target.value)} dir="ltr" />
          </div>
          <${Input} label="العنوان" value=${values.address} onInput=${e => set('address', e.target.value)} />
          <div style="background:var(--g50);border:1px solid var(--g100);padding:12px;border-radius:12px" class="text-sm">
            <div class="text-xs text-gray-500" style="margin-bottom:4px">المنطقة (تُدار من الإدارة)</div>
            <div class="flex items-center gap-1.5 text-gray-900 font-medium"><${IcoMapPin} size=${14} /> ${nameOf(pharmacy.areaId)}</div>
          </div>
          ${error && html`<div class="alert alert-error"><span>${error}</span></div>`}
          ${success && html`<div class="alert alert-success"><span>تم الحفظ بنجاح.</span></div>`}
          <${Button} type="submit" size="lg" block disabled=${saving}>${saving ? 'جارٍ الحفظ...' : 'حفظ التعديلات'}<//>
        </form>
      <//>
    </div>
  `;
}

  const [values, setValues] = useState({ uid: '', email: '', name: '', areaId: '', phone: '', whatsapp: '', address: '' });
  const regions = REGION_LIST;
  const [loading, setLoading] = useState(isEdit);
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState(null);
  const [syncing, setSyncing] = useState(false);
  const [syncedCount, setSyncedCount] = useState(null);

  useEffect(() => {
    let active = true;

    
    if (isEdit && id) {
      getPharmacy(id).then(p => {
        if (p) setValues({ uid: p.id, email: '', name: p.name, areaId: p.areaId, phone: p.phone, whatsapp: p.whatsapp || '', address: p.address || '' });
        if (active) setLoading(false);
      }).catch(() => { if (active) setLoading(false); });
    }
    return () => { active = false; };
  }, [id, isEdit]);

  const set = (k, v) => setValues(p => ({ ...p, [k]: v }));

  const submit = async (e) => {
    e.preventDefault();
    setError(null);
    if (!values.name.trim() || !values.areaId || !values.phone.trim()) { setError('الاسم والمنطقة والهاتف مطلوبة.'); return; }
    if (!isEdit && !values.uid.trim()) { setError('معرّف المستخدم (UID) مطلوب.'); return; }
    setSaving(true);
    try {
      if (isEdit && id) {
        await updatePharmacy(id, { name: values.name, areaId: values.areaId, phone: values.phone, whatsapp: values.whatsapp, address: values.address });
      } else {
        await createPharmacyWithUser({ uid: values.uid, email: values.email, name: values.name, areaId: values.areaId, phone: values.phone, whatsapp: values.whatsapp || undefined, address: values.address || undefined });
      }
      navigate('/admin/pharmacies');
    } catch (err) {
      const msgs = { USER_EXISTS: 'يوجد مستخدم بهذا المعرّف مسبقًا.', PHARMACY_EXISTS: 'توجد صيدلية بهذا المعرّف مسبقًا.', INVALID_UID: 'معرّف المستخدم غير صالح.' };
      setError(msgs[err?.message] || 'تعذر الحفظ.');
    } finally { setSaving(false); }
  };

  const handleSync = async () => {
    if (!id) return;
    if (!confirm('سيتم تحديث الاسم والهاتف والمنطقة في كل أدوية الصيدلية. متابعة؟')) return;
    setSyncing(true); setSyncedCount(null);
    try {
      const p = await getPharmacy(id);
      if (!p) throw new Error('NOT_FOUND');
      const n = await syncPharmacyToInventory(p);
      setSyncedCount(n);
    } catch { alert('تعذرت المزامنة.'); }
    finally { setSyncing(false); }
  };

  if (loading) return html`<div class="spinner-wrap"><${Spinner} /></div>`;

  return html`
    <div style="max-width:42rem;display:flex;flex-direction:column;gap:16px">
      <h1 style="font-size:20px;font-weight:800">${isEdit ? 'تعديل صيدلية' : 'إضافة صيدلية جديدة'}</h1>
      ${!isEdit && html`
        <div class="alert alert-info">
          <${IcoInfo} size=${18} style="flex-shrink:0;margin-top:2px" />
          <div class="text-sm" style="line-height:1.75">
            <strong style="display:block;margin-bottom:4px">قبل المتابعة:</strong>
            1. Firebase Console → Authentication → Add user (بريد وكلمة مرور).<br />
            2. انسخ <code style="background:var(--b200);padding:1px 4px;border-radius:4px">UID</code> الخاص بالمستخدم.<br />
            3. الصقه أدناه، واملأ بيانات الصيدلية.
          </div>
        </div>
      `}
      <${Card}>
        <form onSubmit=${submit} style="display:flex;flex-direction:column;gap:16px">
          ${!isEdit && html`
            <${Input} label="معرّف المستخدم (UID) *" value=${values.uid} onInput=${e => set('uid', e.target.value)} dir="ltr" placeholder="من Firebase Console" required />
            <${Input} label="البريد الإلكتروني (مرجعي)" type="email" value=${values.email} onInput=${e => set('email', e.target.value)} dir="ltr" />
          `}
          <${Input} label="اسم الصيدلية *" value=${values.name} onInput=${e => set('name', e.target.value)} placeholder="صيدلية النور" required />
          <div>
            <label class="input-label">المنطقة *</label>
            <select class="input" value=${values.areaId} onChange=${e => set('areaId', e.target.value)} required>
              <option value="">— اختر —</option>
              ${regions.map(r => html`<option key=${r.id} value=${r.id}>${r.nameAr}</option>`)}
            </select>
          </div>
          <div class="grid gap-4 sm-grid-2">
            <${Input} label="الهاتف *" value=${values.phone} onInput=${e => set('phone', e.target.value)} placeholder="0599123456" dir="ltr" required />
            <${Input} label="واتساب" value=${values.whatsapp} onInput=${e => set('whatsapp', e.target.value)} placeholder="970599123456" dir="ltr" />
          </div>
          <${Input} label="العنوان" value=${values.address} onInput=${e => set('address', e.target.value)} placeholder="شارع عمر المختار، مقابل..." />
          ${isEdit && html`
            <div style="background:var(--g50);border:1px solid var(--g200);padding:12px;border-radius:12px" class="text-sm">
              <div class="font-medium text-gray-800">مزامنة البيانات إلى المخزون</div>
              <p class="text-xs text-gray-600" style="margin-top:4px;line-height:1.65">يحدّث اسم الصيدلية وهاتفها ومنطقتها في كل أدويتها. استخدمه بعد تغيير الاسم أو الهاتف.</p>
              <${Button} type="button" variant="secondary" size="md" onClick=${handleSync} disabled=${syncing} class="mt-2">
                <span class=${syncing ? 'spin' : ''}><${IcoRefresh} size=${16} /></span>
                ${syncing ? 'جارٍ المزامنة...' : 'مزامنة الآن'}
              <//>
              ${syncedCount !== null && html`<div class="text-xs" style="color:var(--d700);margin-top:8px">تم تحديث ${syncedCount} صنفًا.</div>`}
            </div>
          `}
          ${error && html`<div class="alert alert-error"><span>${error}</span></div>`}
          <div class="flex gap-2" style="padding-top:8px">
            <${Link} href="/admin/pharmacies" class="btn btn-ghost btn-lg">إلغاء<//>
            <div class="flex-1"><${Button} type="submit" size="lg" block disabled=${saving}>${saving ? 'جارٍ الحفظ...' : (isEdit ? 'حفظ التعديلات' : 'إنشاء الصيدلية')}<//></div>
          </div>
        </form>
      <//>
    </div>
  `;
}

function AdminUsersPage() {
  const [users, setUsers] = useState(null);
  const [error, setError] = useState(null);
  const [busy, setBusy] = useState(null);

  useEffect(() => {
    listUsers().then(setUsers).catch(() => setError('تعذر تحميل المستخدمين.'));
  }, []);

  const roleLabel = { admin: 'مدير', pharmacy: 'صيدلية', citizen: 'مواطن' };

  const toggle = async (u) => {
    const active = u.isActive !== false;
    if (!confirm(`${active ? 'إيقاف' : 'تفعيل'} حساب ${u.displayName || u.uid}؟`)) return;
    setBusy(u.uid);
    try {
      await setUserActive(u.uid, !active);
      setUsers(list => list.map(x => x.uid === u.uid ? { ...x, isActive: !active } : x));
    } catch { alert('تعذر التحديث.'); }
    finally { setBusy(null); }
  };

  return html`
    <div style="display:flex;flex-direction:column;gap:16px">
      <div>
        <h1 style="font-size:20px;font-weight:800">المستخدمون</h1>
        <p class="text-sm text-gray-600" style="margin-top:2px">${users ? users.length + ' مستخدم' : '—'}</p>
      </div>
      ${error && html`<div class="alert alert-error"><span>${error}</span></div>`}
      ${!users && !error && html`<div class="spinner-wrap"><${Spinner} /></div>`}
      ${users && users.length === 0 && html`<${EmptyState} icon=${h(IcoUsers, { size: 22 })} title="لا يوجد مستخدمون" body="أضف حسابات من Firebase Console ثم أنشئ مستنداتها هنا." />`}
      <div class="grid gap-3">
        ${users && users.map(u => {
          const active = u.isActive !== false;
          return html`
            <div class="card flex items-center justify-between gap-3">
              <div class="min-w-0">
                <div class="font-bold text-gray-900 truncate">${u.displayName || u.uid.slice(0, 8)}</div>
                <div class="text-xs text-gray-500 truncate" dir="ltr">${u.email || u.uid}</div>
                <div class="flex items-center gap-2" style="margin-top:4px">
                  <span class="text-11 font-semibold" style="padding:2px 8px;border-radius:9999px;background:var(--g100);color:var(--g700)">${roleLabel[u.role] || u.role}</span>
                  <span class="text-11 font-semibold" style="padding:2px 8px;border-radius:9999px;border:1px solid ${active ? 'var(--d200)' : 'var(--g200)'};background:${active ? 'var(--d50)' : 'var(--g100)'};color:${active ? 'var(--d700)' : 'var(--g600)'}">${active ? 'مفعّل' : 'موقوف'}</span>
                </div>
              </div>
              <button class="icon-btn ${active ? 'icon-btn-danger' : 'icon-btn-primary'}" onClick=${() => toggle(u)} disabled=${busy === u.uid} aria-label=${active ? 'إيقاف' : 'تفعيل'}><${IcoPower} size=${17} /></button>
            </div>
          `;
        })}
      </div>
    </div>
  `;
}

/* ============================================================
   🧭  App Router
   ============================================================ */
function App() {
  const route = useRoute();
  const { path, params } = route;

  // Public routes
  if (path === '/' || path === '') return h(PublicLayout, null, h(HomePage));
  if (path === '/search') return h(PublicLayout, null, h(SearchPage, { route: { params } }));
  if (path === '/about') return h(PublicLayout, null, h(AboutPage));
  if (path === '/privacy') return h(PublicLayout, null, h(PrivacyPage));
  if (path === '/login') return h(LoginPage);

  // Medicine details
  const medParams = matchPath('/medicine/:id', path);
  if (medParams) return h(PublicLayout, null, h(MedicineDetailsPage, { route: { id: medParams.id } }));

  // Pharmacy
  if (path === '/pharmacy') return h(RequireRole, { allow: ['pharmacy'] }, h(PharmacyLayout, null, h(PharmacyDashboardPage)));
  if (path === '/pharmacy/inventory') return h(RequireRole, { allow: ['pharmacy'] }, h(PharmacyLayout, null, h(PharmacyInventoryPage)));
  if (path === '/pharmacy/inventory/new') return h(RequireRole, { allow: ['pharmacy'] }, h(PharmacyLayout, null, h(AddMedicinePage)));
  const editInvParams = matchPath('/pharmacy/inventory/:id', path);
  if (editInvParams) return h(RequireRole, { allow: ['pharmacy'] }, h(PharmacyLayout, null, h(EditMedicinePage, { route: { id: editInvParams.id } })));
  if (path === '/pharmacy/profile') return h(RequireRole, { allow: ['pharmacy'] }, h(PharmacyLayout, null, h(PharmacyProfilePage)));

  // Admin
  if (path === '/admin') return h(RequireRole, { allow: ['admin'] }, h(AdminLayout, null, h(AdminDashboardPage)));
  if (path === '/admin/pharmacies') return h(RequireRole, { allow: ['admin'] }, h(AdminLayout, null, h(AdminPharmaciesPage)));
  if (path === '/admin/pharmacies/new') return h(RequireRole, { allow: ['admin'] }, h(AdminLayout, null, h(AdminPharmacyFormPage, { route: { id: null } })));
  const editPhParams = matchPath('/admin/pharmacies/:id', path);
  if (editPhParams) return h(RequireRole, { allow: ['admin'] }, h(AdminLayout, null, h(AdminPharmacyFormPage, { route: { id: editPhParams.id } })));
  if (path === '/admin/users') return h(RequireRole, { allow: ['admin'] }, h(AdminLayout, null, h(AdminUsersPage)));

  // 404
  return h(PublicLayout, null, h('div', { class: 'container', style: 'padding:48px 16px;text-align:center' },
    h('h1', { style: 'font-size:24px;font-weight:800' }, 'الصفحة غير موجودة'),
    h(Link, { href: '/', class: 'link-primary', style: 'margin-top:12px;display:inline-block' }, 'العودة للرئيسية')
  ));
}

// تحسينات الواجهة: ظل للشريط العلوي عند التمرير + حركة عند تغيير الصفحة
window.addEventListener('scroll', () => document.body.classList.toggle('scrolled', window.scrollY > 4), { passive: true });
window.addEventListener('hashchange', () => {
  const m = document.querySelector('main');
  if (!m) return;
  m.classList.remove('page-in'); void m.offsetWidth; m.classList.add('page-in');
  window.scrollTo({ top: 0 });
});

// Boot
document.getElementById('boot')?.remove();
render(h(AuthProvider, null, h(App)), document.getElementById('app'));
</script>
</body>
</html>
